# The port's Russian localisation as a mod: the game's text in a language
# the disc does not carry. A package the game loads at boot when it runs
# in Russian; its tables are read by the port's text code under id 0x7EB.
name = "Russian"
creator = "Graine25"
version = "1.0"
description = "Every line of the game and of the port in Russian, on the port's Cyrillic font sheets."
type = "package"

[package]
file = "ReeotRussian.pkz"
id = 0x7EB
language = "ru"
language_name = "Russian"
