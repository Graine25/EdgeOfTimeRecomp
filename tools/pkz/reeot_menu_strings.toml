REEOT_DESC_MNK = "Joue avec le clavier comme manette et la souris comme stick droit."
REEOT_DESC_MOUSE_SENSITIVITY = "L'ampleur du mouvement de la caméra pour un déplacement de la souris, quand Clavier et souris est activé. La souris ne dirige la caméra qu'en plein écran ; en fenêtre, le pointeur reste libre."
