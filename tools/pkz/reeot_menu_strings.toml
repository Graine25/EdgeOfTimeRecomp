REEOT_DESC_FULLSCREEN = "Игра на весь экран или в окне, которое можно двигать и менять в размере."
REEOT_DESC_RESOLUTION = "Разрешение, в котором игра рисует кадр в полноэкранном режиме. «Родное» — собственные 1120x632 консоли, умноженные на масштаб рендера. В окне кадр рисуется в высоте, которую предлагает дисплей, и растягивается по окну."
REEOT_DESC_ASPECT = "Форма кадра в полноэкранном режиме. Шире 16:9 показывает больше по бокам, а не растягивает. В окне кадр следует за окном."
REEOT_DESC_FPS_LIMIT = "Наибольшая частота кадров в секунду. Игра делает один шаг на кадр, так что это задаёт темп всему, а не только картинке."
REEOT_DESC_VSYNC = "Ждёт дисплей перед показом кадра: убирает разрывы и ограничивает частоту частотой дисплея."
REEOT_DESC_RENDER_SCALE = "Насколько крупнее или мельче собственного разрешения консоли рисовать кадр, когда разрешение — «Родное»."
REEOT_DESC_PIP_SCALE = "Разрешение окна, которое открывают способности, в долях от основного изображения. Это вторая сцена со своими источниками света и эффектами: при 50 % она стоит четверть пикселей. Вступает в силу после перезапуска."
REEOT_DESC_BRIGHTNESS = "Осветляет или затемняет весь кадр. Применяется в конце, поверх собственной кривой игры."
REEOT_DESC_CONTRAST = "Растягивает или сжимает картинку вокруг среднего серого."
REEOT_DESC_SATURATION = "Сила цветов: 0% — чёрно-белое, 100% — как в игре."
REEOT_DESC_GAMMA = "Кривая между тёмным и светлым, до собственной кривой консоли."
REEOT_DESC_PRESET = "Задаёт сглаживание, анизотропную фильтрацию, разрешение теней и фильтр масштабирования разом. Любое из них, изменённое вручную, делает предустановку «Своей»."
REEOT_DESC_MSAA = "Сглаживает края геометрии, рисуя каждый проход сцены с несколькими выборками на пиксель. Стоит памяти и пропускной способности соразмерно."
REEOT_DESC_ANISOTROPY = "Сохраняет полы и стены резкими под острыми углами. Почти бесплатно на современной видеокарте."
REEOT_DESC_SHADOW_SIZE = "Размер каждой карты теней. «Авто» следует за разрешением рендера; фиксированные размеры меняют резкость на память."
REEOT_DESC_SHADOW_DISTANCE = "Как далеко отбрасываются тени, кратно тому, что просит уровень. Дальше — та же карта на большей площади."
REEOT_DESC_UPSCALE = "Фильтр, которым кадр подгоняется под окно. Ланцош — самый резкий, билинейный — самый мягкий."
REEOT_DESC_FOV = "Расширяет или сужает камеру. 100% — как в игре."
REEOT_DESC_BLOOM = "Свечение вокруг яркого света. «Выкл.» сохраняет тональную кривую игры."
REEOT_DESC_DOF = "Размывает то, на чём камера не сфокусирована, включая малую глубину резкости в роликах."
REEOT_DESC_MOTION_BLUR = "Смазывает быстрое движение — камеры и того, что она видит."
REEOT_DESC_RADIAL_BLUR = "Скоростные полосы при падениях и рывках."
REEOT_DESC_HEAT = "Тепловое зрение и дрожание горячего воздуха."
REEOT_DESC_FILM_GRAIN = "Мелкое зерно по всему кадру."
REEOT_DESC_HALO = "Свет, растекающийся от самых ярких частей кадра."
REEOT_DESC_COLOR_GRADING = "Собственная цветокоррекция игры. «Выкл.» показывает кадр без неё."
