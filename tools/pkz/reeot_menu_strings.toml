REEOT_DESC_FULLSCREEN = "Ocupa toda la pantalla, o corre en una ventana que se puede mover y cambiar de tamaño."
REEOT_DESC_RESOLUTION = "La resolución a la que se renderiza el juego. Auto la elige según la pantalla: 1440p desde esa altura en adelante, 1080p o 720p por debajo. Nativa es la de la consola, 1120x632, multiplicada por la escala de renderizado. La imagen siempre se adapta a la ventana."
REEOT_DESC_ASPECT = "La forma para la que el juego construye su imagen. Auto sigue a la ventana. Más ancho que 16:9 muestra más a los lados en vez de estirar."
REEOT_DESC_FPS_LIMIT = "El máximo de fotogramas por segundo. El juego avanza un paso por fotograma, así que esto marca el ritmo de todo, no solo de la pantalla."
REEOT_DESC_VSYNC = "Espera a la pantalla antes de mostrar un fotograma, lo que evita el desgarro y limita la tasa a la de la pantalla."
REEOT_DESC_RENDER_SCALE = "Cuánto más grande o más pequeño que la resolución de la consola se renderiza, cuando la resolución es Nativa."
REEOT_DESC_BRIGHTNESS = "Aclara u oscurece toda la imagen. Se aplica al final, sobre la curva de pantalla del juego."
REEOT_DESC_CONTRAST = "Estira o aplana la imagen en torno a su gris medio."
REEOT_DESC_SATURATION = "La intensidad de los colores: 0 % es escala de grises, 100 % es la del juego."
REEOT_DESC_GAMMA = "La curva entre la oscuridad y la luz, antes de la rampa de la consola."
REEOT_DESC_PRESET = "Ajusta a la vez el suavizado de bordes, el filtrado anisotrópico, la resolución de sombras y el filtro de escalado. Cambiar cualquiera de ellos a mano pasa esto a Personalizada."
REEOT_DESC_MSAA = "Suaviza los bordes de la geometría dibujando cada pasada de la escena con varias muestras por píxel. Cuesta memoria y ancho de banda en proporción."
REEOT_DESC_ANISOTROPY = "Mantiene nítidos suelos y paredes en ángulos rasantes. Casi gratis en una tarjeta moderna."
REEOT_DESC_SHADOW_SIZE = "El tamaño de cada mapa de sombras. Auto sigue a la resolución de renderizado; los tamaños fijos cambian nitidez por memoria."
REEOT_DESC_SHADOW_DISTANCE = "Hasta dónde llegan las sombras, como múltiplo de lo que pide el nivel. Más lejos reparte el mismo mapa sobre más terreno."
REEOT_DESC_UPSCALE = "El filtro que adapta la imagen renderizada a la ventana. Lanczos es el más nítido, bilineal el más suave."
REEOT_DESC_FOV = "Abre o cierra la cámara. 100 % es el ajuste del juego."
REEOT_DESC_BLOOM = "El resplandor alrededor de las luces intensas. Desactivado conserva la curva de tonos del juego."
REEOT_DESC_DOF = "Desenfoca lo que la cámara no enfoca, incluido el enfoque corto de las escenas."
REEOT_DESC_MOTION_BLUR = "Estira el movimiento rápido, el de la cámara y el de lo que ve."
REEOT_DESC_RADIAL_BLUR = "Las estelas de velocidad de las caídas libres y los sprints."
REEOT_DESC_HEAT = "La visión térmica y el temblor del aire caliente."
REEOT_DESC_FILM_GRAIN = "Un grano fino sobre toda la imagen."
REEOT_DESC_HALO = "La luz que se derrama desde las partes más brillantes de la imagen."
REEOT_DESC_COLOR_GRADING = "La gradación de color del juego. Desactivado muestra la imagen sin gradar."
REEOT_DESC_RESTART = "Se aplica tras reiniciar."
REEOT_RESTART_TITLE = "¿Reiniciar ahora?"
REEOT_RESTART_BODY = "Algunos de estos ajustes se aplican tras reiniciar. ¿Reiniciar el juego ahora?"

