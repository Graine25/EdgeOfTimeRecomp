REEOT_DESC_FULLSCREEN = "Remplit l'écran, ou tourne dans une fenêtre que l'on peut déplacer et redimensionner."
REEOT_DESC_RESOLUTION = "La résolution de rendu du jeu en plein écran. Native est celle de la console, 1120x632, multipliée par l'échelle de rendu. En fenêtre, le jeu est rendu à la hauteur que suggère l'écran et l'image s'étire à la fenêtre."
REEOT_DESC_ASPECT = "Le format pour lequel le jeu construit son image en plein écran. Plus large que 16:9 montre davantage sur les côtés au lieu d'étirer. En fenêtre, l'image suit la fenêtre."
REEOT_DESC_FPS_LIMIT = "Le nombre maximal d'images par seconde. Le jeu avance d'un pas par image, donc ceci rythme tout, pas seulement l'affichage."
REEOT_DESC_VSYNC = "Attend l'écran avant d'afficher une image, ce qui supprime le déchirement et limite la cadence à celle de l'écran."
REEOT_DESC_RENDER_SCALE = "Rendu plus grand ou plus petit que la résolution de la console, quand la résolution est Native."
REEOT_DESC_PIP_SCALE = "La résolution de la fenêtre incrustée que les pouvoirs ouvrent, en part de l'image principale. C'est une seconde scène avec ses propres lumières et effets : à 50 % elle coûte le quart des pixels. Prend effet au redémarrage."
REEOT_DESC_BRIGHTNESS = "Éclaircit ou assombrit toute l'image. Appliqué en dernier, par-dessus la courbe d'affichage du jeu."
REEOT_DESC_CONTRAST = "Étire ou aplatit l'image autour de son gris moyen."
REEOT_DESC_SATURATION = "L'intensité des couleurs : 0 % est en niveaux de gris, 100 % est celle du jeu."
REEOT_DESC_GAMMA = "La courbe entre l'ombre et la lumière, avant la rampe de la console."
REEOT_DESC_PRESET = "Règle ensemble l'anticrénelage, le filtrage anisotrope, la résolution des ombres et le filtre de mise à l'échelle. Modifier l'un d'eux à la main passe ceci en Personnalisé."
REEOT_DESC_MSAA = "Adoucit les bords de la géométrie en dessinant chaque passe de la scène avec plusieurs échantillons par pixel. Coûte de la mémoire et de la bande passante en proportion."
REEOT_DESC_TAA = "Mélange chaque image avec la précédente, décalée d'une fraction de pixel et reprojetée à travers la caméra, pour que les bords lointains cessent de scintiller. Fonctionne avec ou sans multi-échantillonnage."
REEOT_DESC_ANISOTROPY = "Garde les sols et les murs nets sous les angles rasants. Presque gratuit sur une carte moderne."
REEOT_DESC_SHADOW_SIZE = "La taille de chaque carte d'ombres. Auto suit la résolution de rendu ; les tailles fixes échangent de la netteté contre de la mémoire."
REEOT_DESC_SHADOW_DISTANCE = "La portée des ombres, en multiple de ce que le niveau demande. Plus loin étale la même carte sur plus de terrain."
REEOT_DESC_UPSCALE = "Le filtre qui ajuste l'image rendue à la fenêtre. Lanczos est le plus net, bilinéaire le plus doux."
REEOT_DESC_FOV = "Élargit ou resserre la caméra. 100 % est le réglage du jeu."
REEOT_DESC_BLOOM = "La lueur autour des lumières vives. Désactivé conserve la courbe de tons du jeu."
REEOT_DESC_DOF = "Floute ce sur quoi la caméra ne fait pas le point, y compris la faible profondeur de champ des cinématiques."
REEOT_DESC_MOTION_BLUR = "Étire les mouvements rapides, ceux de la caméra et de ce qu'elle voit."
REEOT_DESC_RADIAL_BLUR = "Les traînées de vitesse des chutes libres et des sprints."
REEOT_DESC_HEAT = "La vision thermique et le miroitement de l'air chaud."
REEOT_DESC_FILM_GRAIN = "Un grain fin sur toute l'image."
REEOT_DESC_HALO = "La lumière qui déborde des parties les plus claires de l'image."
REEOT_DESC_COLOR_GRADING = "L'étalonnage des couleurs du jeu. Désactivé montre l'image brute."
