REEOT_DESC_CAMERA_X = "Inversé tourne la caméra à gauche quand le stick va à droite."
REEOT_DESC_DEBUG_MODE = "Ouvre le sélecteur de niveaux des développeurs depuis l'écran d'accueil à la place de celui du jeu. B ramène à l'écran d'accueil."
