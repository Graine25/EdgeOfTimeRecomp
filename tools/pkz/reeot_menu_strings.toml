REEOT_DESC_CAMERA_Y = "Invertida baja la cámara cuando el stick va hacia arriba."
REEOT_DESC_CAMERA_X = "Invertida gira la cámara a la izquierda cuando el stick va a la derecha."
REEOT_DESC_DEBUG_MODE = "Abre el selector de niveles de los desarrolladores desde la pantalla inicial en lugar del normal. B vuelve a la pantalla inicial."
REEOT_DESC_ACHIEVEMENT_TOASTS = "Muestra un aviso al desbloquear un logro. Desactivado conserva el logro y omite el aviso."
REEOT_DESC_GLYPHS = "De qué mando son los botones que muestran las indicaciones. Auto sigue al dispositivo en uso: los botones del mando, o las teclas asignadas en el teclado."
REEOT_DESC_MNK = "Juega con el teclado como mando y el ratón como stick derecho."
REEOT_DESC_MOUSE_SENSITIVITY = "Cuánto gira la cámara por cada movimiento del ratón, con Teclado y ratón activado. El ratón solo mueve la cámara a pantalla completa; en ventana, el puntero queda libre."
