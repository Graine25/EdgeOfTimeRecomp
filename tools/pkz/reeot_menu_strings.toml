REEOT_DESC_FULLSCREEN = "Riempie lo schermo, oppure gira in una finestra che si può spostare e ridimensionare."
REEOT_DESC_RESOLUTION = "La risoluzione a cui il gioco disegna. Auto la sceglie dallo schermo: 1440p da quell'altezza in su, 1080p o 720p al di sotto. Nativa è quella della console, 1120x632, moltiplicata per la scala di rendering. L'immagine è sempre adattata alla finestra."
REEOT_DESC_ASPECT = "La forma per cui il gioco costruisce l'immagine. Auto segue la finestra. Più largo di 16:9 mostra di più ai lati invece di allungare."
REEOT_DESC_FPS_LIMIT = "Il massimo di fotogrammi al secondo. Il gioco avanza di un passo per fotogramma, quindi questo scandisce tutto, non solo lo schermo."
REEOT_DESC_VSYNC = "Attende lo schermo prima di mostrare un fotogramma: niente strappi, e la frequenza si ferma a quella dello schermo."
REEOT_DESC_RENDER_SCALE = "Di quanto disegnare più grande o più piccolo rispetto alla risoluzione della console, quando la risoluzione è Nativa."
REEOT_DESC_BRIGHTNESS = "Schiarisce o scurisce tutta l'immagine. Applicato per ultimo, sopra la curva di visualizzazione del gioco."
REEOT_DESC_CONTRAST = "Allarga o appiattisce l'immagine attorno al suo grigio medio."
REEOT_DESC_SATURATION = "L'intensità dei colori: 0% è in scala di grigi, 100% è quella del gioco."
REEOT_DESC_GAMMA = "La curva tra buio e luce, prima della rampa della console."
REEOT_DESC_PRESET = "Imposta insieme anti-aliasing, filtro anisotropico, risoluzione delle ombre e filtro di upscaling. Cambiarne uno a mano rende questa Personalizzata."
REEOT_DESC_MSAA = "Ammorbidisce i bordi della geometria disegnando ogni passata della scena con più campioni per pixel. Costa memoria e banda in proporzione."
REEOT_DESC_ANISOTROPY = "Mantiene nitidi pavimenti e pareti agli angoli radenti. Quasi gratis su una scheda moderna."
REEOT_DESC_SHADOW_SIZE = "La dimensione di ogni mappa delle ombre. Auto segue la risoluzione di rendering; le dimensioni fisse scambiano nitidezza con memoria."
REEOT_DESC_SHADOW_DISTANCE = "Fino a dove arrivano le ombre, come multiplo di quanto chiede il livello. Più lontano distribuisce la stessa mappa su più terreno."
REEOT_DESC_UPSCALE = "Il filtro che adatta l'immagine alla finestra. Lanczos è il più nitido, bilineare il più morbido."
REEOT_DESC_FOV = "Allarga o restringe la telecamera. 100% è quello del gioco."
REEOT_DESC_BLOOM = "Il bagliore attorno alle luci intense. Disattivo conserva la curva tonale del gioco."
REEOT_DESC_DOF = "Sfoca ciò su cui la telecamera non è a fuoco, compreso il fuoco ravvicinato dei filmati."
REEOT_DESC_MOTION_BLUR = "Allunga i movimenti rapidi, della telecamera e di ciò che vede."
REEOT_DESC_RADIAL_BLUR = "Le scie di velocità delle cadute libere e degli scatti."
REEOT_DESC_HEAT = "La visione termica e il tremolio dell'aria calda."
REEOT_DESC_FILM_GRAIN = "Una grana fine su tutta l'immagine."
REEOT_DESC_HALO = "La luce che trabocca dalle parti più chiare dell'immagine."
REEOT_DESC_COLOR_GRADING = "La correzione colore del gioco. Disattivo mostra l'immagine senza correzione."
REEOT_DESC_RESTART = "Ha effetto dopo un riavvio."
REEOT_RESTART_TITLE = "Riavviare adesso?"
REEOT_RESTART_BODY = "Alcune di queste impostazioni hanno effetto dopo un riavvio. Riavviare il gioco adesso?"

