REEOT_DESC_FULLSCREEN = "Füllt den Bildschirm, oder läuft in einem Fenster, das sich verschieben und vergrößern lässt."
REEOT_DESC_RESOLUTION = "Die Auflösung, in der das Spiel im Vollbild rendert. Nativ ist die der Konsole, 1120x632, mal der Renderskalierung. Im Fenster rendert das Spiel in der Höhe, die der Bildschirm nahelegt, und das Bild wird auf das Fenster gestreckt."
REEOT_DESC_ASPECT = "Die Form, für die das Spiel sein Bild im Vollbild aufbaut. Breiter als 16:9 zeigt mehr an den Seiten, statt zu strecken. Im Fenster folgt das Bild dem Fenster."
REEOT_DESC_FPS_LIMIT = "Die höchste Bildrate, mit der das Spiel läuft. Das Spiel macht einen Schritt pro Bild, also taktet dies alles, nicht nur die Anzeige."
REEOT_DESC_VSYNC = "Wartet auf den Bildschirm, bevor ein Bild gezeigt wird; das verhindert Zerreißen und begrenzt die Rate auf die des Bildschirms."
REEOT_DESC_RENDER_SCALE = "Wie viel größer oder kleiner als die Konsolenauflösung gerendert wird, wenn die Auflösung Nativ ist."
REEOT_DESC_PIP_SCALE = "Die Auflösung des Bild-im-Bild-Fensters, das die Fähigkeiten öffnen, als Anteil des Hauptbilds. Es ist eine zweite Szene mit eigenen Lichtern und Effekten: bei 50 % kostet sie ein Viertel der Pixel. Wirkt nach einem Neustart."
REEOT_DESC_BRIGHTNESS = "Hebt oder senkt das ganze Bild. Wird zuletzt angewendet, über der Anzeigekurve des Spiels."
REEOT_DESC_CONTRAST = "Streckt oder flacht das Bild um sein Mittelgrau."
REEOT_DESC_SATURATION = "Wie kräftig die Farben sind: 0 % ist Graustufen, 100 % ist die des Spiels."
REEOT_DESC_GAMMA = "Die Kurve zwischen Dunkel und Hell, vor der Rampe der Konsole."
REEOT_DESC_PRESET = "Stellt Kantenglättung, anisotrope Filterung, Schattenauflösung und Skalierungsfilter gemeinsam ein. Wird eines davon von Hand geändert, wird dies zu Eigene."
REEOT_DESC_MSAA = "Glättet die Kanten der Geometrie, indem jeder Szenendurchgang mit mehreren Abtastungen pro Pixel gezeichnet wird. Kostet entsprechend Speicher und Bandbreite."
REEOT_DESC_TAA = "Mischt jedes Bild mit dem vorherigen, um einen Bruchteil eines Pixels versetzt und durch die Kamera zurückprojiziert, damit ferne Kanten nicht mehr flimmern. Funktioniert mit und ohne Multisampling."
REEOT_DESC_ANISOTROPY = "Hält Böden und Wände in flachen Winkeln scharf. Auf einer modernen Karte fast umsonst."
REEOT_DESC_SHADOW_SIZE = "Die Größe jeder Schattenkarte. Auto folgt der Renderauflösung; die festen Größen tauschen Schärfe gegen Speicher."
REEOT_DESC_SHADOW_DISTANCE = "Wie weit Schatten geworfen werden, als Vielfaches dessen, was der Level verlangt. Weiter verteilt dieselbe Karte über mehr Boden."
REEOT_DESC_UPSCALE = "Der Filter, der das gerenderte Bild ins Fenster einpasst. Lanczos ist am schärfsten, bilinear am weichsten."
REEOT_DESC_FOV = "Weitet oder verengt die Kamera. 100 % ist die Einstellung des Spiels."
REEOT_DESC_BLOOM = "Das Leuchten um helles Licht. Aus behält die Tonkurve des Spiels."
REEOT_DESC_DOF = "Verwischt, worauf die Kamera nicht scharf stellt, auch die geringe Schärfentiefe der Zwischensequenzen."
REEOT_DESC_MOTION_BLUR = "Verwischt schnelle Bewegung, der Kamera und dessen, was sie sieht."
REEOT_DESC_RADIAL_BLUR = "Die Geschwindigkeitsstreifen bei freiem Fall und Sprints."
REEOT_DESC_HEAT = "Wärmesicht und das Flimmern heißer Luft."
REEOT_DESC_FILM_GRAIN = "Eine feine Körnung über dem ganzen Bild."
REEOT_DESC_HALO = "Licht, das aus den hellsten Teilen des Bildes ausläuft."
REEOT_DESC_COLOR_GRADING = "Die Farbkorrektur des Spiels. Aus zeigt das unkorrigierte Bild."
REEOT_AUDIO_TITLE = "AUDIO"
REEOT_GAME_TITLE = "SPIEL"
REEOT_CONTROLS_TITLE = "STEUERUNG"
REEOT_OPT_SFX_VOLUME = "Effektlautstärke"
REEOT_OPT_VOICE_VOLUME = "Sprachlautstärke"
