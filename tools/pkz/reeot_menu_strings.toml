REEOT_VAL_KEYBOARD = "Клавиатура"
REEOT_DESC_LANGUAGE = "Язык текста и — где он есть в игре — речи. «Авто» следует за языком Windows. Читается при запуске игры."
REEOT_DESC_RESTART = "Вступает в силу после перезапуска."
REEOT_RESTART_TITLE = "Перезапустить сейчас?"
REEOT_RESTART_BODY = "Часть этих настроек вступает в силу после перезапуска. Перезапустить игру сейчас?"
REEOT_OPT_MOTION_VECTORS = "Векторы движения"
REEOT_DESC_MOTION_VECTORS = "Сообщает временному сглаживанию, где каждый движущийся персонаж и предмет был в прошлом кадре, чтобы они устаканивались, как декорации, а не размывались. Требует временного сглаживания."
REEOT_OPT_TAA = "Временное сглаживание"
REEOT_DESC_TAA = "Смешивает каждый кадр с предыдущим, смещённым на долю пикселя и перепроецированным через камеру, чтобы дальние края перестали мерцать. Работает с мультисэмплингом и без него."
