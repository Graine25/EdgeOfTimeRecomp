REEOT_DESC_SPATIAL_AUDIO = "Располагает звуки вокруг слушателя. Пока ни к чему не подключено."
REEOT_DESC_BATTLE_THEME = "Включает боевую музыку в драках. Пока ни к чему не подключено."
REEOT_DESC_VIBRATION = "Вибрация геймпада."
REEOT_DESC_CAMERA_Y = "При инверсии камера опускается, когда стик идёт вверх."
REEOT_DESC_CAMERA_X = "При инверсии камера поворачивается влево, когда стик идёт вправо."
REEOT_DESC_DEBUG_MODE = "Открывает с главного экрана собственный выбор уровней разработчиков вместо обычного. B возвращает на главный экран."
REEOT_DESC_ACHIEVEMENT_TOASTS = "Показывает уведомление, когда открыто достижение. «Выкл.» сохраняет достижение, но без всплывающего окна."
REEOT_DESC_GLYPHS = "Кнопки какого геймпада показывать в подсказках. «Авто» следует за устройством в руках: кнопки геймпада или назначенные клавиши на клавиатуре."
REEOT_DESC_MNK = "Клавиатура вместо геймпада, мышь вместо правого стика."
REEOT_DESC_MOUSE_SENSITIVITY = "Насколько поворачивается камера от движения мыши, пока включены клавиатура и мышь. Мышь управляет камерой только в полноэкранном режиме; в окне указатель свободен."
REEOT_DESC_BACKGROUND_INPUT = "Продолжает читать геймпад, пока активно другое окно."
REEOT_OPT_LANGUAGE = "Язык"
