REEOT_DESC_FPS_LIMIT = "Die höchste Bildrate des Spiels."
REEOT_DESC_VSYNC = "Synchronisiert Bilder mit dem Bildschirm gegen Zerreißen."
REEOT_DESC_RENDER_SCALE = "Rendert über oder unter der gewählten Auflösung. Über 100 % ist schärfer, darunter schneller."
REEOT_DESC_BRIGHTNESS = "\\MENUSELECT\\ öffnet den Helligkeitsbildschirm des Spiels."
REEOT_DESC_CONTRAST = "Streckt oder flacht das Bild um sein Mittelgrau."
REEOT_DESC_SATURATION = "Wie kräftig die Farben sind: 0 % ist Graustufen, 100 % ist die des Spiels."
REEOT_DESC_GAMMA = "Die Kurve zwischen Dunkel und Hell."
REEOT_DESC_PRESET = "Stellt Kantenglättung, anisotrope Filterung, Schattenauflösung und Skalierungsfilter gemeinsam ein. Wird eines davon von Hand geändert, wird dies zu Eigene."
REEOT_DESC_MSAA = "Die Kanten des Spiels selbst, geglättet indem jeder Szenendurchgang mit mehreren Abtastungen pro Pixel gezeichnet wird. Kostet Speicher und Bandbreite im Verhältnis."
REEOT_DESC_HOST_AA = "Der Durchgang des Ports über das fertige Bild, zusätzlich zu den Kanten des Spiels. Temporal mischt jedes Bild mit dem vorherigen, um einen Bruchteil eines Pixels versetzt, damit ferne Kanten nicht mehr flimmern."
REEOT_DESC_ANISOTROPY = "Hält Böden und Wände in flachen Winkeln scharf. Auf einer modernen Karte fast umsonst."
REEOT_DESC_SHADOW_SIZE = "Die Größe jeder Schattenkarte. Auto folgt der Renderauflösung; die festen Größen tauschen Schärfe gegen Speicher."
REEOT_DESC_UPSCALE = "Der Filter, der das gerenderte Bild ins Fenster einpasst. Lanczos ist am schärfsten, bilinear am weichsten."
REEOT_DESC_FOV = "Weitet oder verengt die Kamera. 100 % ist die Einstellung des Spiels."
REEOT_DESC_BLOOM = "Das Leuchten um helles Licht. Aus behält die Tonkurve des Spiels."
REEOT_DESC_DOF = "Verwischt, worauf die Kamera nicht scharf stellt, auch die geringe Schärfentiefe der Zwischensequenzen."
REEOT_DESC_MOTION_BLUR = "Verwischt schnelle Bewegung, der Kamera und dessen, was sie sieht."
REEOT_DESC_HEAT = "Wärmesicht und das Flimmern heißer Luft."
REEOT_DESC_FILM_GRAIN = "Eine feine Körnung über dem ganzen Bild."
REEOT_DESC_HALO = "Licht, das aus den hellsten Teilen des Bildes ausläuft."
REEOT_DESC_COLOR_GRADING = "Die Farbkorrektur des Spiels. Aus zeigt das unkorrigierte Bild."
