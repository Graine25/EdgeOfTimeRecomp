REEOT_DESC_LANGUAGE = "El idioma de los textos y, cuando el juego lo tiene, de las voces. Auto sigue el idioma de pantalla de Windows. Se lee al iniciar el juego."
REEOT_DESC_RESTART = "Se aplica tras reiniciar."
